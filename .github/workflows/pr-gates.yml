# G1/G4 evidence: the PR description must classify the change, link an
# accepted RFC for architecture/UX changes, and include a passing independent
# review that covers the PR's code. See docs/gates.md.
#
# Everything is read live at run time, so edits and "Re-run" always check the
# current PR against the current rules:
# - the checker comes from the tip of the base branch (not the PR's recorded
#   base.sha, which GitHub does not advance when main moves), so a PR cannot
#   change the rules it is checked against and picks up fixes to them;
# - the PR description and head commit come from the API, not the event
#   payload (which re-runs replay unchanged).
name: pr-gates
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the PR as it is now
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" > pr.json
          jq -r '.body // ""' pr.json > body.md
          echo "HEAD_SHA=$(jq -r .head.sha pr.json)" >> "$GITHUB_ENV"
          echo "HEAD_REPO=$(jq -r .head.repo.full_name pr.json)" >> "$GITHUB_ENV"
          echo "BASE_REF=$(jq -r .base.ref pr.json)" >> "$GITHUB_ENV"
      # The checker, from the current tip of the (live) base branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_REF }}
          path: base
          persist-credentials: false
      # The PR's code at the live head commit, only to compute the diff hash
      # and changed files. Nothing from it is executed.
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.HEAD_REPO }}
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          path: pr
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check PR description
        run: |
          TOOLS=$(cd base/scripts/ci && pwd)
          BASE_TIP=$(git -C base rev-parse HEAD)
          cd pr
          # The base commit comes from this repository (a fork's own branch may be stale).
          git fetch -q "https://github.com/${{ github.repository }}" "$BASE_TIP"
          MERGE_BASE=$(git merge-base "$HEAD_SHA" "$BASE_TIP")
          export DIFF_SHA256=$("$TOOLS/review-diff.sh" "$MERGE_BASE" "$HEAD_SHA" | shasum -a 256 | cut -d' ' -f1)
          export CHANGED_FILES=$(git diff --name-only --no-renames "$MERGE_BASE" "$HEAD_SHA")
          export PR_BODY="$(cat ../body.md)"
          echo "PR head $HEAD_SHA; checker and RFC statuses from $BASE_REF @ ${BASE_TIP:0:7}"
          # RFC statuses are read from the base checkout (the current main).
          cd ../base
          RFC_REF=HEAD node "$TOOLS/check-pr-body.mjs"

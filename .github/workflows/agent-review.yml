# G4 in CI (RFC 0003): the independent agent review runs on every PR's latest
# commit and is posted as one comment, updated in place. Powered by Meta's
# Muse model at the Contributor tier (META_API_KEY secret) through the same
# locked-down harness as scripts/review.sh.
#
# Isolation: the reviewer instructions, scripts, and principles come from the
# current base branch; the PR's code is read, never executed; PRs that change
# agent configuration are refused until a human has looked.
#
# Volume: pull_request_target is not covered by GitHub's "approve fork PR
# workflows" setting, so automatic runs are limited to authors with standing
# in the repo. For first-time contributors a maintainer adds the
# `agent-review` label (only users with write access can label).
name: agent-review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One review per PR; a new push cancels the old run. Unrelated label events
  # get their own group so they never cancel a review in progress.
  group: >-
    agent-review-${{ github.event.pull_request.number }}-${{
    (github.event.action == 'labeled' && github.event.label.name != 'agent-review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  agent-review:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent-review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      MAX_DIFF_LINES: 4000
    steps:
      - name: Decide whether to review
        id: decide
        env:
          ACTION: ${{ github.event.action }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HAS_KEY: ${{ secrets.META_API_KEY != '' }}
        run: |
          forced=false
          [ "$ACTION" = labeled ] && forced=true
          echo "forced=$forced" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != true ]; then
            echo "skip=The META_API_KEY repository secret is not set, so the automatic review did not run." >> "$GITHUB_OUTPUT"
          elif [ "$forced" != true ]; then
            case "$ASSOCIATION" in
              OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR) ;;
              *) echo "skip=First-time contributor: a maintainer can run the review by adding the \`agent-review\` label." >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - uses: actions/checkout@v4
        if: steps.decide.outputs.skip == ''
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        if: steps.decide.outputs.skip == ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false

      - name: Check the diff
        id: diff
        if: steps.decide.outputs.skip == ''
        env:
          FORCED: ${{ steps.decide.outputs.forced }}
        run: |
          cd pr
          git fetch -q origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if git diff --name-only "$MERGE_BASE" "$HEAD_SHA" | grep -qE '(^|/)(\.claude/|\.muse/|\.mcp\.json$|CLAUDE(\.local)?\.md$)'; then
            echo "skip=This PR changes agent configuration (.claude/, .muse/, .mcp.json, CLAUDE.md, CLAUDE.local.md). Review those changes by hand; the automated review did not run." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LINES=$("$GITHUB_WORKSPACE/base/scripts/ci/review-diff.sh" "$MERGE_BASE" "$HEAD_SHA" | wc -l)
          if [ "$LINES" -eq 0 ]; then
            echo "skip=No reviewable changes (only generated code or lockfiles)." >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$LINES" -gt "$MAX_DIFF_LINES" ] && [ "$FORCED" != true ]; then
            echo "skip=The diff is $LINES lines (limit $MAX_DIFF_LINES, excluding generated code). Split the PR, or a maintainer can force the review with the \`agent-review\` label." >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.decide.outputs.skip == '' && steps.diff.outputs.skip == ''
        with:
          node-version: 22
      - name: Install the review harness
        if: steps.decide.outputs.skip == '' && steps.diff.outputs.skip == ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Independent review
        id: review
        if: steps.decide.outputs.skip == '' && steps.diff.outputs.skip == ''
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          BASE_SHA: ${{ steps.diff.outputs.base_sha }}
        run: |
          cd pr
          set +e
          REVIEW_PROVIDER=muse \
            REVIEW_BASE="$BASE_SHA" \
            REVIEW_PROMPT_FILE="$GITHUB_WORKSPACE/base/docs/review/reviewer.md" \
            REVIEW_DOCS_ROOT="$GITHUB_WORKSPACE/base" \
            timeout 900 "$GITHUB_WORKSPACE/base/scripts/review.sh"
          STATUS=$?
          set -e
          OUT=".gates/review-$HEAD_SHA.md"
          {
            if [ -f "$OUT" ]; then cat "$OUT"; else echo "The review produced no output (exit $STATUS); see the workflow log."; fi
          } | perl -pe 's/\Q$ENV{META_API_KEY}\E/[redacted]/g' > ../review.md
          # Trust review.sh's integrity check (reviewed SHA and diff hash), not
          # just the text: 0 pass, 1 another valid verdict, 3 invalid output,
          # 124 timeout.
          RAW=$(grep -E '^VERDICT:' ../review.md | tail -1 | sed -E 's/^VERDICT:[[:space:]]*//' | tr -d '[:space:]' || true)
          # Only known verdicts pass through; the model's text never does.
          case $STATUS in
            0) VERDICT=pass ;;
            1) case $RAW in changes-requested | needs-rfc) VERDICT=$RAW ;; *) VERDICT=error ;; esac ;;
            3) VERDICT=invalid ;;
            4) VERDICT=agent-failed ;;
            124) VERDICT=timeout ;;
            *) VERDICT=error ;;
          esac
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Post or update the review comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ steps.decide.outputs.skip }}${{ steps.diff.outputs.skip }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          MARK='<!-- agent-review -->'
          {
            echo "$MARK"
            echo "### Independent agent review (CI)"
            echo
            if [ -n "$SKIP" ]; then
              echo "**Not reviewed.** $SKIP"
            else
              echo "Commit \`$HEAD_SHA\` - verdict: **${VERDICT:-none}**. Reviewer instructions and principles from the current \`$BASE_REF\`."
              echo
              if [ -f review.md ]; then cat review.md; else echo "The review did not complete; see the workflow log."; fi
            fi
          } > comment.md
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARK\"))) | .id" | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
          fi

      - name: Fail on a non-passing verdict
        if: steps.review.outputs.verdict != '' && steps.review.outputs.verdict != 'pass'
        env:
          # Step outputs go through env, never ${{ }} in a script: derived
          # values must not become shell code in this privileged job.
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          echo "::error::independent review verdict: $VERDICT"
          exit 1

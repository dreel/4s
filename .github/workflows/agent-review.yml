# G4 in CI (RFC 0003): the independent agent review runs on every PR's latest
# commit and is posted as one comment, updated in place. Powered by Meta's
# Muse model at the Contributor tier (META_API_KEY secret) through the same
# locked-down harness as scripts/review.sh.
#
# Isolation: the reviewer instructions, scripts, and principles come from the
# current base branch; the PR's code is read, never executed; PRs that change
# agent configuration are refused until a human has looked.
#
# Volume: pull_request_target is not covered by GitHub's "approve fork PR
# workflows" setting, so automatic runs are limited to authors with standing
# in the repo. For first-time contributors a maintainer adds the
# `agent-review` label (only users with write access can label).
#
# Spend guards for automatic runs (Meta offers no spending limit), tunable
# with repository variables:
# - AGENT_REVIEW_ENABLED=false pauses automatic reviews (kill switch);
# - debounce: wait AGENT_REVIEW_DEBOUNCE_SECONDS (120) first, so a burst of
#   pushes cancels down to one review;
# - caps: AGENT_REVIEW_DAILY_LIMIT (50) reviews per rolling 24 h repo-wide,
#   AGENT_REVIEW_PR_DAILY_LIMIT (10) per PR. Only runs whose review step
#   actually ran count.
# Adding the `agent-review` label bypasses all of these (maintainer's call).
name: agent-review
run-name: "agent-review #${{ github.event.pull_request.number }}"
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  # One review per PR; a new push cancels the old run. Unrelated label events
  # get their own group so they never cancel a review in progress.
  group: >-
    agent-review-${{ github.event.pull_request.number }}-${{
    (github.event.action == 'labeled' && github.event.label.name != 'agent-review') && github.run_id || 'review' }}
  cancel-in-progress: true

jobs:
  agent-review:
    if: >-
      !github.event.pull_request.draft &&
      (github.event.action != 'labeled' || github.event.label.name == 'agent-review')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      MAX_DIFF_LINES: 4000
    steps:
      - name: Decide whether to review
        id: decide
        env:
          ACTION: ${{ github.event.action }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HAS_KEY: ${{ secrets.META_API_KEY != '' }}
          ENABLED: ${{ vars.AGENT_REVIEW_ENABLED }}
        run: |
          forced=false
          [ "$ACTION" = labeled ] && forced=true
          echo "FORCED=$forced" >> "$GITHUB_ENV"
          skip=
          if [ "$HAS_KEY" != true ]; then
            skip="The META_API_KEY repository secret is not set, so the automatic review did not run."
          elif [ "$forced" != true ]; then
            if [ "$ENABLED" = false ]; then
              skip="Automatic reviews are paused (repository variable AGENT_REVIEW_ENABLED=false). A maintainer can still run one with the \`agent-review\` label."
            else
              case "$ASSOCIATION" in
                OWNER|MEMBER|COLLABORATOR|CONTRIBUTOR) ;;
                *) skip="First-time contributor: a maintainer can run the review by adding the \`agent-review\` label." ;;
              esac
            fi
          fi
          echo "SKIP=$skip" >> "$GITHUB_ENV"

      # A newer push cancels this run while it waits, so bursts of pushes
      # produce one review.
      - name: Debounce
        if: env.SKIP == '' && env.FORCED != 'true'
        env:
          DEBOUNCE: ${{ vars.AGENT_REVIEW_DEBOUNCE_SECONDS }}
        run: sleep "${DEBOUNCE:-120}"

      - name: Check the review budget
        if: env.SKIP == '' && env.FORCED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_LIMIT: ${{ vars.AGENT_REVIEW_DAILY_LIMIT }}
          PR_DAILY_LIMIT: ${{ vars.AGENT_REVIEW_PR_DAILY_LIMIT }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          DAILY_LIMIT=${DAILY_LIMIT:-50}
          PR_DAILY_LIMIT=${PR_DAILY_LIMIT:-10}
          SINCE=$(date -u -d '24 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          total=0
          this_pr=0
          # Count runs in the last 24 h whose review step actually ran. If the
          # API call fails, this step fails and no review runs (fail closed).
          RUNS=$(gh api -X GET "repos/$REPO/actions/workflows/agent-review.yml/runs" \
            -f created=">=$SINCE" -f per_page=100 --paginate \
            --jq ".workflow_runs[] | select(.id != $RUN_ID) | \"\\(.id) \\(.display_title)\"")
          while read -r id title; do
            [ -n "$id" ] || continue
            ran=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq \
              '[.jobs[].steps[]? | select(.name == "Independent review" and (.status == "in_progress" or .conclusion == "success" or .conclusion == "failure" or .conclusion == "cancelled"))] | length')
            if [ "$ran" -gt 0 ]; then
              total=$((total + 1))
              if [ "$title" = "agent-review #$PR" ]; then this_pr=$((this_pr + 1)); fi
            fi
          done <<< "$RUNS"
          echo "reviews in the last 24 h: $total repo-wide (limit $DAILY_LIMIT), $this_pr for this PR (limit $PR_DAILY_LIMIT)"
          if [ "$total" -ge "$DAILY_LIMIT" ]; then
            echo "SKIP=Daily review limit reached ($total reviews in the last 24 hours, limit $DAILY_LIMIT). A maintainer can force one with the \`agent-review\` label." >> "$GITHUB_ENV"
          elif [ "$this_pr" -ge "$PR_DAILY_LIMIT" ]; then
            echo "SKIP=This PR's review limit is reached ($this_pr reviews in the last 24 hours, limit $PR_DAILY_LIMIT). A maintainer can force one with the \`agent-review\` label." >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP == ''
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        if: env.SKIP == ''
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: pr
          persist-credentials: false

      - name: Check the diff
        id: diff
        if: env.SKIP == ''
        env:
        run: |
          cd pr
          git fetch -q origin "$BASE_REF"
          BASE_SHA=$(git rev-parse FETCH_HEAD)
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          if git diff --name-only "$MERGE_BASE" "$HEAD_SHA" | grep -qE '(^|/)(\.claude/|\.muse/|\.mcp\.json$|CLAUDE(\.local)?\.md$)'; then
            echo "SKIP=This PR changes agent configuration (.claude/, .muse/, .mcp.json, CLAUDE.md, CLAUDE.local.md). Review those changes by hand; the automated review did not run." >> "$GITHUB_ENV"
            exit 0
          fi
          LINES=$("$GITHUB_WORKSPACE/base/scripts/ci/review-diff.sh" "$MERGE_BASE" "$HEAD_SHA" | wc -l)
          if [ "$LINES" -eq 0 ]; then
            echo "SKIP=No reviewable changes (only generated code or lockfiles)." >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$LINES" -gt "$MAX_DIFF_LINES" ] && [ "$FORCED" != true ]; then
            echo "SKIP=The diff is $LINES lines (limit $MAX_DIFF_LINES, excluding generated code). Split the PR, or a maintainer can force the review with the \`agent-review\` label." >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP == ''
        with:
          node-version: 22
      - name: Install the review harness
        if: env.SKIP == ''
        run: npm install -g @anthropic-ai/claude-code

      - name: Independent review
        id: review
        if: env.SKIP == ''
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
          BASE_SHA: ${{ steps.diff.outputs.base_sha }}
        run: |
          cd pr
          set +e
          REVIEW_PROVIDER=muse \
            REVIEW_BASE="$BASE_SHA" \
            REVIEW_PROMPT_FILE="$GITHUB_WORKSPACE/base/docs/review/reviewer.md" \
            REVIEW_DOCS_ROOT="$GITHUB_WORKSPACE/base" \
            timeout 900 "$GITHUB_WORKSPACE/base/scripts/review.sh"
          STATUS=$?
          set -e
          OUT=".gates/review-$HEAD_SHA.md"
          {
            if [ -f "$OUT" ]; then cat "$OUT"; else echo "The review produced no output (exit $STATUS); see the workflow log."; fi
          } | perl -pe 's/\Q$ENV{META_API_KEY}\E/[redacted]/g' > ../review.md
          # Trust review.sh's integrity check (reviewed SHA and diff hash), not
          # just the text: 0 pass, 1 another valid verdict, 3 invalid output,
          # 124 timeout.
          RAW=$(grep -E '^VERDICT:' ../review.md | tail -1 | sed -E 's/^VERDICT:[[:space:]]*//' | tr -d '[:space:]' || true)
          # Only known verdicts pass through; the model's text never does.
          case $STATUS in
            0) VERDICT=pass ;;
            1) case $RAW in changes-requested | needs-rfc) VERDICT=$RAW ;; *) VERDICT=error ;; esac ;;
            3) VERDICT=invalid ;;
            4) VERDICT=agent-failed ;;
            124) VERDICT=timeout ;;
            *) VERDICT=error ;;
          esac
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

      - name: Post or update the review comment
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          MARK='<!-- agent-review -->'
          {
            echo "$MARK"
            echo "### Independent agent review (CI)"
            echo
            if [ -n "$SKIP" ]; then
              echo "**Not reviewed.** $SKIP"
            else
              echo "Commit \`$HEAD_SHA\` - verdict: **${VERDICT:-none}**. Reviewer instructions and principles from the current \`$BASE_REF\`."
              echo
              if [ -f review.md ]; then cat review.md; else echo "The review did not complete; see the workflow log."; fi
            fi
          } > comment.md
          ID=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$MARK\"))) | .id" | tail -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$ID" -F body=@comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "${{ github.repository }}" --body-file comment.md
          fi

      - name: Fail on a non-passing verdict
        if: steps.review.outputs.verdict != '' && steps.review.outputs.verdict != 'pass'
        env:
          # Step outputs go through env, never ${{ }} in a script: derived
          # values must not become shell code in this privileged job.
          VERDICT: ${{ steps.review.outputs.verdict }}
        run: |
          echo "::error::independent review verdict: $VERDICT"
          exit 1
